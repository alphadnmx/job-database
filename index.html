<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Database">
<meta name="theme-color" content="#f2b705">
<title>Workshop Job Database</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#1c1d1f; --muted:#6b6d70; --line:#dcd8cf;
  --accent:#f2b705; --accent-ink:#1c1d1f; --danger:#c0392b; --chip:#ebe7de;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141517; --card:#1e2023; --ink:#ecebe7; --muted:#9a9ca0; --line:#2f3236; --chip:#2a2d31; --danger:#e5675a;
}}
:root[data-theme="dark"]{--bg:#141517; --card:#1e2023; --ink:#ecebe7; --muted:#9a9ca0; --line:#2f3236; --chip:#2a2d31; --danger:#e5675a;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Barlow Condensed",Arial Narrow,sans-serif;font-weight:700;line-height:1.1;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.85em}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:3px solid var(--accent)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.brand h1{font-size:1.9rem;letter-spacing:.01em}
.brand small{color:var(--muted)}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.make{margin-top:22px}
.make>h2{font-size:1.6rem;display:flex;justify-content:space-between;align-items:baseline}
.make>h2 span{font-family:Barlow;font-size:.85rem;color:var(--muted);font-weight:500}
.model{margin:10px 0 0;border-left:3px solid var(--line);padding-left:10px}
.model h3{font-size:1.2rem;color:var(--muted);margin-bottom:6px}
.job{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.job .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.job .yr{font-family:"Barlow Condensed";font-weight:700;font-size:1.15rem}
.job .date{color:var(--muted);font-size:.85rem}
.job .sym{margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:.8rem}
.tag.code{font-family:"IBM Plex Mono";font-size:.75rem}
.tag.open{background:var(--danger);color:#fff}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:16px 22px;font-family:"Barlow Condensed";font-weight:700;font-size:1.2rem;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:50px 10px}
/* sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
#editor{z-index:30}
.sheet.show{display:block}
.sheet .bar{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--line);z-index:2}
.sheet .bar h2{font-size:1.4rem}
.sheet .bar .btn{min-height:44px;min-width:76px;touch-action:manipulation}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.del{color:var(--danger)}
.form{max-width:760px;margin:0 auto;padding:14px}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-family:"Barlow Condensed";font-weight:700;font-size:1.15rem;margin-bottom:6px;padding:0}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 3px}
.f{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea.f{min-height:84px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.parts .prow{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;margin-bottom:6px}
.parts .prow button{border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
.detail{max-width:760px;margin:0 auto;padding:14px}
.detail h2.big{font-size:2rem}
.detail .sub{color:var(--muted);margin-bottom:10px}
.detail section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.detail section h3{font-size:1.1rem;margin-bottom:4px}
.detail p{margin:0;white-space:pre-wrap}
.detail table{width:100%;border-collapse:collapse;font-size:.95rem}
.detail td{padding:5px 0;border-bottom:1px solid var(--line)}
.detail td:last-child{text-align:right;color:var(--muted)}
.similar{margin-top:18px}
/* lock */
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{width:100%;max-width:340px;text-align:center}
#lock h1{font-size:2.4rem;border-bottom:3px solid var(--accent);display:inline-block;margin-bottom:14px}
#lock input{text-align:center;font-size:1.2rem;letter-spacing:.2em;margin:10px 0}
#lock .msg{color:var(--danger);min-height:1.5em;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;z-index:60}
.menu{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;justify-content:center}
.menu .btn{font-weight:500;font-size:.9rem}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3 .yrbox{grid-column:1/-1}}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.ph button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.ph.loading::after{content:"…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;touch-action:pinch-zoom;display:none;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px)}
#lightbox.show{display:flex}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <h1>Job Database</h1>
  <p id="lockText">Log in to continue.</p>
  <input id="email" class="f" type="email" autocomplete="username" placeholder="Email" style="letter-spacing:0;font-size:1rem">
  <input id="pin" class="f" type="password" autocomplete="current-password" placeholder="Password">
  <button id="unlockBtn" class="btn pri" style="width:100%">Log in</button>
  <div class="msg" id="lockMsg"></div>
</div></div>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Workshop Job Database</h1><small id="count"></small></div>
    <div class="search"><input id="q" type="search" placeholder="Search symptoms, codes, parts, reg…" autocomplete="off"></div>
    <div class="cats" id="catFilter"></div>
  </header>
  <main id="list"></main>
  <div class="menu">
    <button class="btn" id="csvBtn">Export to Excel (CSV)</button>
    <button class="btn" id="importBtn">Import from Google Sheet app</button>
    <button class="btn" id="logoutBtn">Log out</button>
  </div>
</div>
<button class="fab" id="addBtn">+ Add Job</button>

<!-- editor -->
<div class="sheet" id="editor">
  <div class="bar"><button class="btn" data-close>Cancel</button><h2 id="edTitle">Add Job</h2><button class="btn pri" id="saveBtn">Save</button></div>
  <div class="form">
    <fieldset><legend>Vehicle</legend>
      <div class="grid3">
        <div><label>Manufacturer *</label><select class="f" id="s_make"></select><input class="f" id="e_make" autocapitalize="words" placeholder="Type manufacturer" style="display:none;margin-top:6px"></div>
        <div><label>Model *</label><select class="f" id="s_model"></select><input class="f" id="e_model" autocapitalize="words" placeholder="Type model" style="display:none;margin-top:6px"></div>
        <div class="yrbox"><label>Model year</label><input class="f" id="e_year" type="number" inputmode="numeric" min="1950" max="2100"></div>
      </div>
      <div class="grid">
        <div><label>Engine / variant</label><input class="f" id="e_engine" placeholder="e.g. 2.0 TDI CFFB"></div>
        <div><label>Gearbox</label><input class="f" id="e_gearbox" placeholder="e.g. DSG DQ250"></div>
        <div><label>Registration</label><input class="f mono" id="e_reg" autocapitalize="characters"></div>
        <div><label>Mileage</label><input class="f" id="e_miles" type="number" inputmode="numeric"></div>
      </div>
      <label>VIN</label><input class="f mono" id="e_vin" autocapitalize="characters">
    </fieldset>
    <fieldset><legend>Job</legend>
      <div class="grid">
        <div><label>Date</label><input class="f" id="e_date" type="date"></div>
        <div><label>Status</label><select class="f" id="e_status"><option value="fixed">Fixed</option><option value="open">Ongoing / unresolved</option><option value="returned">Came back</option></select></div>
      </div>
      <label>Fault categories</label><div class="catpick" id="e_cats"></div>
    </fieldset>
    <fieldset><legend>Symptoms</legend><textarea class="f" id="e_symptoms" placeholder="What the customer reported / what you observed"></textarea></fieldset>
    <fieldset><legend>Diagnostics</legend>
      <label>Fault codes (comma separated)</label><input class="f mono" id="e_codes" autocapitalize="characters" placeholder="P0299, P2563">
      <label>Tests, readings and findings</label><textarea class="f" id="e_diag" placeholder="Live data, pressures, voltages, smoke test results…"></textarea>
      <label>Root cause</label><textarea class="f" id="e_cause" style="min-height:60px"></textarea>
    </fieldset>
    <fieldset class="parts"><legend>Parts replaced</legend>
      <div id="e_parts"></div>
      <button class="btn" id="addPart" type="button">+ Add part</button>
    </fieldset>
    <fieldset><legend>Photos</legend>
      <div class="phgrid" id="e_photos"></div>
      <label class="btn" style="display:inline-block;color:var(--ink);margin-top:6px">+ Add photos<input type="file" id="photoInput" accept="image/*" multiple hidden></label>
      <div id="upStatus" style="color:var(--muted);font-size:.85rem;margin-top:4px"></div>
    </fieldset>
    <fieldset><legend>Notes / tips for next time</legend><textarea class="f" id="e_notes"></textarea></fieldset>
    <button class="btn del" id="delBtn" style="display:none">Delete this job</button>
  </div>
</div>

<!-- detail -->
<div class="sheet" id="viewer">
  <div class="bar"><button class="btn" data-close>Back</button><span></span><button class="btn pri" id="editBtn">Edit</button></div>
  <div class="detail" id="detail"></div>
</div>

<datalist id="makes"></datalist><datalist id="models"></datalist>
<div class="toast" id="toast"></div>
<div id="lightbox"><img alt=""></div>

<script>
const CATS=["Engine","Fuel","Ignition","Exhaust / Emissions","Gearbox","Clutch","Driveline","Cooling","HVAC","Electrical","Charging / Starting","Lighting","Infotainment","ECU / Software","Suspension","Steering","Brakes","Wheels / Tyres","Chassis","Body","Interior","Other"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let jobs=[], filterCat=null, editingId=null, viewingId=null;
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2200)};
// Firebase is loaded by the module script at the bottom of the page.
let fbResolve; const fbReady=new Promise(r=>fbResolve=r);
let FB=null;
// Same function names the page used before, now backed by Firebase.
const call=async(fn,...args)=>{ await fbReady; if(!FB.uid)throw new Error("Not logged in"); return FB[fn](...args); };
function showLogin(msg){
  closeAll(); $("#lock").style.display="flex"; $("#lockMsg").textContent=msg||""; $("#pin").value="";
  setTimeout(()=>($("#email").value?$("#pin"):$("#email")).focus(),50);
}
async function doLogin(){
  const b=$("#unlockBtn"); if(b.disabled)return; b.disabled=true; b.textContent="Checking…"; $("#lockMsg").textContent="";
  try{ await fbReady; await FB.login($("#email").value.trim(),$("#pin").value); $("#pin").value=""; }
  catch(e){
    const c=e.code||"";
    $("#lockMsg").textContent=/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?"Wrong email or password.":
      /too-many-requests/.test(c)?"Too many attempts. Wait a few minutes and try again.":
      /network/.test(c)?"No connection. Check your signal.":(e.message||String(e));
  }
  b.disabled=false; b.textContent="Log in";
}
let unsubJobs=null;
function startApp(){
  $("#lock").style.display="none";
  if(unsubJobs)return;
  if(!jobs.length)$("#list").innerHTML='<div class="empty">Loading jobs…</div>';
  // Live connection: changes appear instantly, and the app works offline from the phone's copy.
  unsubJobs=FB.watchJobs(list=>{
    jobs=list; render();
    if(viewingId&&$("#viewer").classList.contains("show")&&!$("#editor").classList.contains("show"))showDetail(viewingId);
  },err=>{$("#list").innerHTML='<div class="empty">Couldn&#39;t load jobs: '+esc(err.message)+'</div>'});
}
function stopApp(){ if(unsubJobs){unsubJobs();unsubJobs=null} jobs=[]; render(); }
function load(){}
function cacheJobs(){}
/* ---------- list ---------- */
function haystack(j){return [j.make,j.model,j.year,j.engine,j.gearbox,j.reg,j.vin,j.symptoms,j.diag,j.cause,j.notes,(j.codes||[]).join(" "),(j.cats||[]).join(" "),(j.parts||[]).map(p=>p.name+" "+p.pn).join(" ")].join(" ").toLowerCase()}
function matches(j,q){ if(filterCat&&!(j.cats||[]).includes(filterCat))return false; if(!q)return true; const h=haystack(j); return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>h.includes(w)) }
function render(){
  const q=$("#q").value.trim(); const list=jobs.filter(j=>matches(j,q));
  $("#count").textContent=jobs.length+" job"+(jobs.length==1?"":"s");
  $("#makes").innerHTML=[...new Set(jobs.map(j=>j.make))].sort().map(m=>`<option value="${esc(m)}">`).join("");
  renderCatFilter();
  if(!list.length){$("#list").innerHTML=`<div class="empty">${jobs.length?"No jobs match that search.":"No jobs yet. Tap <b>+ Add Job</b> to log your first one."}</div>`;return}
  const tree={};
  list.forEach(j=>{(tree[j.make]??={})[j.model]??=[];tree[j.make][j.model].push(j)});
  const cmp=(a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"});
  $("#list").innerHTML=Object.keys(tree).sort(cmp).map(mk=>{
    const models=tree[mk]; const n=Object.values(models).flat().length;
    return `<section class="make"><h2>${esc(mk)}<span>${n} job${n==1?"":"s"}</span></h2>`+
      Object.keys(models).sort(cmp).map(md=>`<div class="model"><h3>${esc(md)}</h3>`+
        models[md].sort((a,b)=>(b.year||0)-(a.year||0)||String(b.date).localeCompare(a.date)).map(card).join("")+`</div>`).join("")+`</section>`;
  }).join("");
}
function card(j){
  return `<button class="job" data-id="${esc(j.id)}"><div class="row1"><span class="yr">${esc(j.year||"—")} ${esc(j.engine||"")}</span><span class="date">${esc(fmtDate(j.date))}</span></div>
  <div class="sym">${esc(j.symptoms||j.cause||"No symptoms recorded")}</div>
  <div class="tags">${j.status==="open"?'<span class="tag open">Unresolved</span>':j.status==="returned"?'<span class="tag open">Came back</span>':""}${(j.cats||[]).map(c=>`<span class="tag">${esc(c)}</span>`).join("")}${(j.photos||[]).length?`<span class="tag">📷 ${j.photos.length}</span>`:""}${(j.codes||[]).slice(0,3).map(c=>`<span class="tag code">${esc(c)}</span>`).join("")}</div></button>`;
}
function fmtDate(d){if(!d)return"";const x=new Date(d+"T00:00");return isNaN(x)?d:x.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function renderCatFilter(){
  const used=new Set(jobs.flatMap(j=>j.cats||[]));
  $("#catFilter").innerHTML=`<button class="chip ${filterCat?"":"on"}" data-cat="">All</button>`+CATS.filter(c=>used.has(c)).map(c=>`<button class="chip ${filterCat===c?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}
$("#catFilter").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;filterCat=b.dataset.cat||null;render()};
$("#q").oninput=render;
$("#list").onclick=e=>{const b=e.target.closest(".job");if(b)showDetail(b.dataset.id)};

/* ---------- detail ---------- */
function showDetail(id){
  const j=jobs.find(x=>x.id===id); if(!j)return closeAll(); viewingId=id;
  const sec=(t,v)=>v?`<section><h3>${t}</h3><p>${esc(v)}</p></section>`:"";
  const sim=jobs.filter(x=>x.id!==id&&x.make===j.make&&(x.model===j.model||(x.cats||[]).some(c=>(j.cats||[]).includes(c)))).slice(0,6);
  $("#detail").innerHTML=`<h2 class="big">${esc(j.make)} ${esc(j.model)}</h2>
   <div class="sub">${esc([j.year,j.engine,j.gearbox].filter(Boolean).join(" · "))}</div>
   <div class="tags">${(j.cats||[]).map(c=>`<span class="tag">${esc(c)}</span>`).join("")}</div>
   <section><table>
     ${row("Date",fmtDate(j.date))}${row("Status",{fixed:"Fixed",open:"Ongoing / unresolved",returned:"Came back"}[j.status]||"")}
     ${row("Reg",j.reg)}${row("VIN",j.vin)}${row("Mileage",j.miles?Number(j.miles).toLocaleString():"")}
   </table></section>
   ${sec("Symptoms",j.symptoms)}
   ${(j.codes||[]).length?`<section><h3>Fault codes</h3><div class="tags">${j.codes.map(c=>`<span class="tag code">${esc(c)}</span>`).join("")}</div></section>`:""}
   ${sec("Diagnostics",j.diag)}${sec("Root cause",j.cause)}
   ${(j.parts||[]).length?`<section><h3>Parts replaced</h3><table>${j.parts.map(p=>`<tr><td>${esc(p.name)}</td><td class="mono">${esc(p.pn)}</td></tr>`).join("")}</table></section>`:""}
   ${sec("Notes",j.notes)}
   ${(j.photos||[]).length?`<section><h3>Photos</h3><div class="phgrid">${j.photos.map(p=>`<div class="ph loading" data-pid="${esc(p)}"></div>`).join("")}</div></section>`:""}
   ${sim.length?`<div class="similar"><h3 style="margin-bottom:6px">Related ${esc(j.make)} jobs</h3>${sim.map(card).join("")}</div>`:""}`;
  openSheet("viewer"); $("#viewer").scrollTop=0;
  $("#detail").querySelectorAll(".ph[data-pid]").forEach(fillPhoto);
}
const row=(k,v)=>v?`<tr><td>${k}</td><td>${esc(v)}</td></tr>`:"";
$("#detail").onclick=e=>{const b=e.target.closest(".job");if(b)showDetail(b.dataset.id)};
$("#editBtn").onclick=()=>openEditor(viewingId);

/* ---------- editor ---------- */
const F=["make","model","year","engine","gearbox","reg","miles","vin","date","status","symptoms","diag","cause","notes"];
function openEditor(id){
  editingId=id||null; const j=id?jobs.find(x=>x.id===id):{date:new Date().toISOString().slice(0,10),status:"fixed"};
  $("#edTitle").textContent=id?"Edit Job":"Add Job";
  F.forEach(k=>$("#e_"+k).value=j[k]??"");
  $("#e_codes").value=(j.codes||[]).join(", ");
  $("#e_cats").innerHTML=CATS.map(c=>`<button type="button" class="chip ${(j.cats||[]).includes(c)?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("#e_parts").innerHTML=""; (j.parts&&j.parts.length?j.parts:[{name:"",pn:""}]).forEach(addPartRow);
  edPhotos=[...(j.photos||[])]; newUploads=[]; removedPhotos=[]; renderEdPhotos();
  $("#delBtn").style.display=id?"inline-block":"none";
  syncVehicleSelects(); openSheet("editor"); $("#editor").scrollTop=0;
}
function addPartRow(p={name:"",pn:""}){

// Each open screen adds a browser history entry, so the phone's back
// gesture/button closes the top screen instead of leaving the app.
const stack=[];
function showEl(name,on){ if(name==="lightbox")$("#lightbox").classList.toggle("show",on); else $("#"+name).classList.toggle("show",on); }
function openSheet(name){
  if(stack.includes(name)){showEl(name,true);return}
  stack.push(name); showEl(name,true);
  history.pushState({depth:stack.length},"");
}
function hideTop(){
  const name=stack.pop(); if(!name)return;
  if(name==="editor"&&newUploads.length){call("trashPhotos",newUploads).catch(()=>{});newUploads=[];}
  showEl(name,false);
}
function closeTop(){ if(stack.length)history.back(); }
function closeAll(){ if(stack.length)history.go(-stack.length); }
window.addEventListener("popstate",e=>{
  const depth=(e.state&&e.state.depth)||0;
  while(stack.length>depth)hideTop();
});

function downscale(src,max,q){
  return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(drawTo(im,im.naturalWidth,im.naturalHeight,max,q));im.onerror=()=>rej(new Error("bad image"));im.src=src});
}
function drawTo(source,w,h,max,q){
  const s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s));
  const ctx=c.getContext("2d"); ctx.imageSmoothingQuality="high"; ctx.drawImage(source,0,0,c.width,c.height);
  const out=c.toDataURL("image/jpeg",q); c.width=c.height=0; return out;
}
// Each photo must fit in one database document (1 MB), so step the size/quality down if needed.
function fitFull(src,w,h){
  let out="";
  for(const [max,q] of [[1600,0.8],[1600,0.68],[1400,0.62],[1200,0.6],[1000,0.55]]){
    out=drawTo(src,w,h,max,q); if(out.length<900000)return out;
  }
  return out;
}
// Decodes a camera photo at a reduced size where the browser allows it (saves a lot of memory
// on modern phones with 48MP+ cameras), then makes a 1600px copy and a 360px thumbnail.
async function prepare(file){
  let bmp=null;
  if(window.createImageBitmap){
    try{bmp=await createImageBitmap(file,{resizeWidth:2000,resizeQuality:"high"})}catch(e){}
    if(!bmp){try{bmp=await createImageBitmap(file)}catch(e){}}
  }
  if(bmp){
    const full=fitFull(bmp,bmp.width,bmp.height), thumb=drawTo(bmp,bmp.width,bmp.height,360,0.7);
    bmp.close&&bmp.close(); return {full,thumb};
  }
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("This photo format can't be read. Try taking it as a JPEG."));i.src=url});
    return {full:fitFull(im,im.naturalWidth,im.naturalHeight),thumb:drawTo(im,im.naturalWidth,im.naturalHeight,360,0.7)};
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- one-off import from the old Google Sheet app ---------- */
$("#importBtn").onclick=async()=>{
  const url=(prompt("Paste your old Apps Script URL (ends in /exec):")||"").trim();
  if(!url)return;
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url))return alert("That doesn't look like an Apps Script /exec URL.");
  const pw=prompt("Old app password (the APP_PASSWORD you set in Script Properties):"); if(!pw)return;
  const api=async(fn,...args)=>{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})});
    const d=await r.json(); if(!d.ok)throw new Error(d.error); return d.result;
  };
  const status=m=>{$("#count").textContent=m};
  try{
    status("Connecting to old app…");
    const tok=await api("login",pw);
    const old=await api("getJobs",tok);
    if(!confirm(`Found ${old.length} jobs. Import them now? Keep the app open until it finishes.`))return;
    let done=0, photosDone=0, failed=0;
    for(const j of old){
      const refs=[];
      for(const r of (j.photos||[])){
        try{
          const fullId=String(r).split(":")[0];
          const map=await api("getPhotos",tok,[fullId]);
          if(!map[fullId])throw new Error("missing");
          const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=map[fullId]});
          const ref=await call("uploadPhoto",fitFull(im,im.naturalWidth,im.naturalHeight),drawTo(im,im.naturalWidth,im.naturalHeight,360,0.7));
          refs.push(ref); photosDone++;
        }catch(e){failed++}
        status(`Importing… ${done}/${old.length} jobs, ${photosDone} photos`);
      }
      const {id,updated,...rest}=j;
      await call("saveJob",{...rest,photos:refs,id:String(id||"").replace(/[^\w\-]/g,"")});
      done++; status(`Importing… ${done}/${old.length} jobs, ${photosDone} photos`);
    }
    alert(`Import finished: ${done} jobs and ${photosDone} photos.`+(failed?` ${failed} photos couldn't be copied.`:""));
  }catch(e){alert("Import failed: "+e.message)}
  render();
};
</script>
